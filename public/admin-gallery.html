<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- public/admin-gallery.html excerpt -->
<h2>Admin Command Center - Master Portfolio Assets</h2>
<input type="text" id="searchBox" placeholder="Type a student email or keyword to filter..." onkeyup="loadGallery()">

<div id="galleryGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px;">
    <!-- JavaScript will dynamically inject cards here -->
</div>

<script>
    async function loadGallery() {
        const filterText = document.getElementById('searchBox').value;
        const response = await fetch(`/admin/view-all?search=${encodeURIComponent(filterText)}`);
        const submissions = await response.json();

        const grid = document.getElementById('galleryGrid');
        grid.innerHTML = ''; // Clear old entries

        submissions.forEach(item => {
            grid.innerHTML += `
            <div style="background: white; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                <strong>Uploaded By:</strong> ${item.UserEmail}<br>
                <p><strong>Description:</strong> ${item.FileDescription}</p>
                <img src="${item.BlobStorageURL}" style="width: 100%; max-height: 200px; object-fit: cover;" onerror="this.src='file-icon.png';"><br>
                <small>${new Date(item.UploadedAt).toLocaleDateString()}</small>
            </div>
        `;
        });
    }
    window.onload = loadGallery;
</script>

</body>
</html>
